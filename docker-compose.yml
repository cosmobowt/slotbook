services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: slotbook
    ports:
      - "5432:5432"
    volumes:
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d slotbook"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/slotbook
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # docker compose run --rm test
  test:
    build: .
    profiles: ["test"]
    command: ["pnpm", "test"]
    environment:
      DATABASE_URL_TEST: postgres://postgres:postgres@db:5432/slotbook_test
    depends_on:
      db:
        condition: service_healthy
